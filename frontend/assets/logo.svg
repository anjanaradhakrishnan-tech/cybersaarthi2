<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="500" height="500" rx="100" fill="#0f172a" />
  
  <!-- Outer Shield -->
  <path d="M 250,70 L 390,140 C 390,290 320,380 250,430 C 180,380 110,290 110,140 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)" />
        
  <!-- Inner Protection Emblem -->
  <path d="M 250,110 L 350,165 C 350,270 295,340 250,380 C 205,340 150,270 150,165 Z" 
        fill="#0f172a" opacity="0.9" />

  <!-- Charioteer Saarthi Steering Wheel / Safety Ring -->
  <circle cx="250" cy="235" r="55" fill="none" stroke="url(#accentGrad)" stroke-width="12" />
  <circle cx="250" cy="235" r="20" fill="#2563eb" />
  <path d="M 250,180 L 250,290 M 195,235 L 305,235 M 210,195 L 290,275 M 210,275 L 290,195" 
        stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
        
  <!-- Text Branding -->
  <text x="250" y="440" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="800" font-size="34" letter-spacing="2">CYBERSAARTHI</text>
</svg>
