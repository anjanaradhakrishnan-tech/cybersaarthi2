server.port=8085
spring.application.name=cybersaarthi-backend

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:cybersaarthidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Custom Helpline Configuration
cybersaarthi.helpline.number=1800-CYBER-HELP
cybersaarthi.emergency.national-cyber-crime=1930
